plugins {
    id "com.android.application"
}

// OpenXR loader (Khronos openxr_loader_for_android AAR, unpacked). Same layout the GBA Quest ports use.
// Default: deps/oxr inside the repo (tools/fetch_openxr.sh). Override with -PopenxrDir or OPENXR_ANDROID_DIR.
def openxrDir = file(project.findProperty("openxrDir") ?: System.getenv("OPENXR_ANDROID_DIR") ?:
        (file("../../deps/oxr").isDirectory() ? "../../deps/oxr" : "../../../deps/oxr"))
def openxrInclude = new File(openxrDir, "prefab/modules/headers/include").canonicalPath
def openxrLib = new File(openxrDir, "jni/arm64-v8a/libopenxr_loader.so").canonicalPath

android {
    namespace "com.subsetgames.ftl"
    compileSdk 34

    defaultConfig {
        applicationId "com.subsetgames.ftl"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.6.21"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared",
                          "-DFTL_ENABLE_OPENXR=ON",
                          "-DFTL_OPENXR_INCLUDE_DIR=${openxrInclude}",
                          "-DFTL_OPENXR_LIB=${openxrLib}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [new File(openxrDir, "jni")]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
